<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <!-- 移动端适配：按设备宽度布局，禁止初始缩放；viewport-fit=cover 适配刘海屏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FlappyBird</title>

    <!-- 图标 -->
    <link rel="shortcut icon" href="./asset/image/bird_icon.png">

    <!-- 全屏无边框样式 -->
    <style type="text/css">
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none; /* 禁止下拉刷新与回弹 */
            touch-action: none; /* 禁用双击缩放等浏览器手势，保证点按即时响应 */
        }
    </style>
</head>

<body>
    <canvas></canvas>
</body>

<!-- 加载js -->
<script src="vars.js" type="text/javascript"></script>
<script src="res.js" type="text/javascript"></script>
<script src="director.js" type="text/javascript"></script>
<script src="scenes.js" type="text/javascript"></script>
<script src="sprites.js" type="text/javascript"></script>
<script src="index.js" type="text/javascript"></script>

</html>
